# Put these lines in the :443 vhost, ABOVE the generic "ProxyPass /api/ ..." line.
ProxyPass /api/user/login          http://127.0.0.1:3100/api/user/login
ProxyPass /api/user/signup         http://127.0.0.1:3100/api/user/signup
ProxyPass /api/user/uploadmediaV1  http://127.0.0.1:3100/api/user/uploadmediaV1
ProxyPass /api/user/forwardreceiptv2 http://127.0.0.1:3100/api/user/forwardreceiptv2
ProxyPass /api/receipt/addReceiptv1    http://127.0.0.1:3100/api/receipt/addReceiptv1
ProxyPass /api/receipt/updateReceiptv1 http://127.0.0.1:3100/api/receipt/updateReceiptv1
ProxyPass /api/receipt/editReceiptv1   http://127.0.0.1:3100/api/receipt/editReceiptv1
ProxyPass /api/receipt/updateReceipt   http://127.0.0.1:3100/api/receipt/updateReceipt
ProxyPass /api/receipt/editReceipt     http://127.0.0.1:3100/api/receipt/editReceipt
